[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-search-app"
version = "0.1.5"
description = "Full-stack AI Search Application Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "argon2-cffi>=23.1.0",
    "sqlalchemy>=2.0",
    "pgvector>=0.2.0",
    "psycopg[binary]>=3.1.0",
    "pyodbc>=5.0.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.5",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "azure-storage-blob>=12.19.0",
    "pymupdf>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".local/pytest-cache"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app", "app.*", "tenants", "tenants.*", "fixtures"]
namespaces = true

[tool.setuptools.package-data]
tenants = ["**/*.json", "**/*.png", "**/*.webp"]
fixtures = ["local-university/*.pdf", "local-university/*.json"]

[tool.setuptools.exclude-package-data]
"*" = [".env", ".env.*", "**/.env*", "*.pem", "*.key", "*.pfx", "*.pyc"]

