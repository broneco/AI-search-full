[project]
name = "ai-search-app"
version = "0.1.0"
description = "Full-stack AI Search Application Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pgvector>=0.2.0",
    "psycopg[binary]>=3.1.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "azure-storage-blob>=12.19.0",
    "pymupdf>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
